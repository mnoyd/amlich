name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Validate shared holiday data
        run: node scripts/check-holiday-data.mjs

      - name: Check Rust/JS holiday parity
        run: node scripts/check-holiday-parity.mjs

      - name: Clippy
        run: cargo clippy --workspace --exclude am-lich -- -D warnings

      - name: Run tests
        run: cargo test --workspace --exclude am-lich

  desktop:
    name: Desktop smoke (Tauri am-lich + frontend)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: apps/desktop/pnpm-lock.yaml

      - name: Install Tauri system dependencies (Linux)
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: ". -> target;apps/desktop/src-tauri -> apps/desktop/src-tauri/target"

      - name: Install frontend deps
        run: cd apps/desktop && pnpm install --frozen-lockfile

      - name: Clippy (am-lich)
        run: cargo clippy --package am-lich --no-deps -- -D warnings

      - name: Rust unit tests (am-lich Tauri commands)
        run: cargo test --package am-lich

      - name: Frontend type-check (svelte-check)
        run: cd apps/desktop && pnpm exec svelte-kit sync && pnpm check

      - name: Frontend build (vite)
        run: cd apps/desktop && pnpm build
